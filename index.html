let activeKidsUtterance=null;
function speakKids(text){
  if(!('speechSynthesis' in window)){toast(kt('noSpeechKids')||tr('noSpeech'));return}
  const synth=window.speechSynthesis;
  synth.cancel();
  const speakNow=()=>{
    const u=new SpeechSynthesisUtterance(String(text));
    activeKidsUtterance=u;
    u.lang='nl-NL'; u.rate=.76; u.pitch=1.03; u.volume=1;
    const vs=synth.getVoices ? synth.getVoices() : [];
    u.voice=vs.find(v=>v.lang?.toLowerCase()==='nl-nl') || vs.find(v=>v.lang?.toLowerCase().startsWith('nl')) || null;
    try{ synth.resume(); synth.speak(u); }catch(e){ toast(kt('noSpeechKids')||tr('noSpeech')); }
  };
  const voices=synth.getVoices ? synth.getVoices() : [];
  if(voices.length) speakNow();
  else {
    let done=false;
    const finish=()=>{if(done)return;done=true;synth.removeEventListener?.('voiceschanged',finish);speakNow()};
    synth.addEventListener?.('voiceschanged',finish);
    setTimeout(finish,350);
  }
}

function learned(){try{return JSON.parse(localStorage.getItem('yanimda_learned')||'[]')}catch{return[]}}function saveLearned(a){localStorage.setItem('yanimda_learned',JSON.stringify(a))}function streak(){return Number(localStorage.getItem('yanimda_streak')||0)}function touchStreak(){const today=new Date().toISOString().slice(0,10),last=localStorage.getItem('yanimda_last_day');if(last===today)return;const prev=new Date(Date.now()-86400000).toISOString().slice(0,10);localStorage.setItem('yanimda_streak',String(last===prev?streak()+1:1));localStorage.setItem('yanimda_last_day',today)}

function nav(){bottomNav.innerHTML=[['home','⌂',tr('home')],['learn','📖','Öğren'],['translate','文',tr('translate')],['nearby','⌖',tr('nearby')]].map(x=>`<button data-page="${x[0]}" onclick="show('${x[0]}')"><span class="nav-icon">${x[1]}</span><span>${esc(x[2])}</span></button>`).join('')}
function drawerHTML(){drawer.innerHTML=`<div class="drawer-head"><div><strong>YANIMDA</strong><small>Her zaman yanında.</small></div><button onclick="toggleMenu()" aria-label="Close">×</button></div><button onclick="go('home')">⌂ <span>${esc(tr('home'))}</span></button><button onclick="go('learn')">📖 <span>${esc(tr('learn'))}</span></button><button onclick="go('translate')">文 <span>${esc(tr('translate'))}</span></button><button onclick="go('nearby')">⌖ <span>${esc(tr('nearby'))}</span></button><button onclick="go('explore')">🧭 <span>${esc(tr('explore'))}</span></button><button onclick="go('kids')">🌈 <span>${esc(kt('title'))}</span></button><button class="disabled" onclick="toast(tr('jobsBody'))">💼 <span>${esc(tr('jobs'))} · ${esc(tr('coming'))}</span></button><button onclick="go('settings')">⚙️ <span>${esc(tr('settings'))}</span></button><button onclick="go('about')">❤️ <span>${esc(tr('about'))}</span></button><div class="drawer-note">${lang()==='ar'?'أنت لست وحدك في بلد جديد.':lang()==='en'?'You are not alone in a new country.':'Yeni bir ülkede yalnız değilsin.'}</div>`}
function layout(content){return content}
function setup(){document.documentElement.lang='tr';document.documentElement.dir='ltr';screen.innerHTML=`<div class="setup-screen"><div class="setup-card"><span class="eyebrow">🧡 YANIMDA</span><h1>${T.tr.choose}</h1><p class="sub">${T.tr.hint}</p><div class="language-options"><button class="lang-btn" data-lang="tr" onclick="pickLang('tr')"><span>🇹🇷</span>Türkçe</button><button class="lang-btn" data-lang="ar" onclick="pickLang('ar')"><span>🇸🇦</span>العربية</button><button class="lang-btn" data-lang="en" onclick="pickLang('en')"><span>🇬🇧</span>English</button></div><p class="setup-note">${T.tr.setupNote}</p><button id="continueBtn" class="primary" style="width:100%" onclick="finishSetup()" disabled>${T.tr.continue}</button></div></div>`;bottomNav.innerHTML='';drawer.innerHTML=''}
let selectedLang='';function pickLang(v){selectedLang=v;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('selected',b.dataset.lang===v));document.getElementById('continueBtn').disabled=!v}function finishSetup(){if(!selectedLang)return;setLang(selectedLang);show('home')}
function show(page){if(!lang()){setup();return}drawerHTML();nav();document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')renderHome();if(page==='learn')renderLearn();if(page==='lesson')renderLesson(window.lessonId||lessons[0].id);if(page==='translate')renderTranslate();if(page==='nearby')renderNearby();if(page==='explore')renderExplore();if(page==='settings')renderSettings();if(page==='jobs')renderJobs();if(page==='kids')renderKids();if(page==='kidlesson')renderKidLesson(window.kidLessonId||kidsLessons[0].id);if(page==='about')renderAbout();window.scrollTo({top:0,behavior:'auto'});screen.focus({preventScroll:true})}
function renderHome(){const done=learned().length,total=lessons.reduce((n,l)=>n+l.words.length,0),pct=Math.min(100,Math.round(done/total*100));const daily=lessons[new Date().getDate()%lessons.length];screen.innerHTML=`<section class="hero"><span class="eyebrow">🇳🇱 ${esc(tr('today'))}</span><h1>${esc(tr('welcome'))}</h1><p>${esc(tr('homeSub'))}</p><div class="hero-card"><strong>${esc(daily.title[lang()])}</strong><p>${esc(daily.sub[lang()])}</p><button class="primary" onclick="showLesson('${daily.id}')">${esc(tr('startLearn'))}</button></div></section><div class="section-head"><h2>${esc(tr('progress'))}</h2><span>${done}/${total}</span></div><div class="progress-card"><div class="progress-line"><span style="width:${pct}%"></span></div><div class="progress-meta"><span>${pct}%</span><span>${esc(tr('words'))}: ${done}</span></div></div><div class="stats"><div class="stat"><b>${pct}%</b><small>${esc(tr('progress'))}</small></div><div class="stat"><b>${streak()}</b><small>${esc(tr('streak'))}</small></div><div class="stat"><b>${done}</b><small>${esc(tr('words'))}</small></div></div><div class="section-head"><h2>${esc(tr('quick'))}</h2></div><div class="grid"><button class="card feature-card" onclick="show('learn')"><span class="icon">📖</span><div><h3>${esc(tr('learn'))}</h3><p>${esc(tr('learnSub'))}</p></div></button><button class="card feature-card" onclick="show('translate')"><span class="icon">💬</span><div><h3>${esc(tr('translate'))}</h3><p>${esc(tr('translateSub'))}</p></div></button><button class="card feature-card" onclick="show('nearby')"><span class="icon">📍</span><div><h3>${esc(tr('nearby'))}</h3><p>${esc(tr('nearbySub'))}</p></div></button><button class="card feature-card explore-feature" onclick="show('explore')"><span class="icon">🧭</span><div><h3>${esc(tr('explore'))}</h3><p>${esc(tr('exploreSub'))}</p></div></button><button class="card feature-card kids-feature" onclick="show('kids')"><span class="icon">🌈</span><div><h3>${esc(kt('title'))}</h3><p>${esc(kt('sub'))}</p></div></button><button class="card feature-card" onclick="show('jobs')"><span class="icon">💼</span><div><h3>${esc(tr('jobs'))}</h3><p>${esc(tr('coming'))}</p></div></button></div>`}
function renderLearn(){const done=learned(),daily=lessons[new Date().getDate()%lessons.length];screen.innerHTML=`<button class="back" onclick="show('home')">${esc(tr('back'))}</button><h1 class="page-title">🇳🇱 ${esc(tr('learn'))}</h1><p class="sub">${esc(tr('learnSub'))}</p><div class="progress-card"><div class="progress-meta"><span>${esc(tr('progress'))}</span><strong>${Math.min(100,Math.round(done.length/lessons.reduce((n,l)=>n+l.words.length,0)*100))}%</strong></div><div class="progress-line"><span style="width:${Math.min(100,Math.round(done.length/lessons.reduce((n,l)=>n+l.words.length,0)*100))}%"></span></div><div class="progress-meta"><span>🔥 ${streak()} ${esc(tr('streak'))}</span><span>${done.length} ${esc(tr('words'))}</span></div></div><div class="section-head"><h2>${esc(tr('daily'))}</h2><span>${esc(daily.title[lang()])}</span></div><button class="lesson-card" onclick="showLesson('${daily.id}')"><div class="top"><span class="pill">A1 · Nederlands</span><span>${daily.icon}</span></div><h3>${esc(daily.title[lang()])}</h3><p>${esc(daily.sub[lang()])}</p><div class="count">${daily.words.length} ${esc(tr('lessonCount'))} · ${esc(tr('start'))} →</div></button><div class="section-head"><h2>${esc(tr('allLessons'))}</h2><span>${lessons.length} ${esc(tr('lessonCount'))}</span></div><div class="lesson-grid">${lessons.map(l=>`<button class="lesson-card" onclick="showLesson('${l.id}')"><div class="top"><span class="pill">A1</span><span>${l.icon}</span></div><h3>${esc(l.title[lang()])}</h3><p>${esc(l.sub[lang()])}</p><div class="count">${l.words.length} ${esc(tr('lessonCount'))}</div></button>`).join('')}</div><div class="section-head"><h2>${esc(tr('review'))}</h2></div><div class="review-card card"><h3>${esc(tr('review'))}</h3><p>${esc(tr('reviewSub'))}</p><button class="primary" style="margin-top:13px" onclick="showReview()">${esc(tr('review'))} →</button></div>`}
function showLesson(id){window.lessonId=id;show('lesson')}
function renderLesson(id){const l=lessons.find(x=>x.id===id)||lessons[0],a=learned();screen.innerHTML=`<button class="back" onclick="show('learn')">${esc(tr('back'))}</button><span class="pill" style="margin-top:16px">A1 · Nederlands</span><h1 class="page-title">${l.icon} ${esc(l.title[lang()])}</h1><p class="sub">${esc(l.sub[lang()])}</p><div class="detail-card"><div class="listen-banner"><div><strong>🔊 ${esc(tr('learn'))}</strong><small>${esc(tr('pron'))} · ${esc(tr('meaning'))}: ${esc(appLanguages[lang()].name)}</small></div><button class="primary" onclick="speak('${escA(l.words[0][0])}')">${esc(tr('listen'))}</button></div>${l.words.map(w=>{const d=a.includes(w[0]);return `<div class="example ${d?'learned':''}"><strong>${esc(w[0])}</strong><div class="phonetic"><span>${esc(tr('pron'))}:</span> ${esc(pronunciation(w))}</div><div class="meaning-label">${appLanguages[lang()].flag} ${esc(appLanguages[lang()].name)}</div><div class="meaning">${esc(w[2][lang()]||w[2].tr)}</div><div class="lesson-actions"><button class="ghost" onclick="speak('${escA(w[0])}')">🔊 ${esc(tr('listen'))}</button><button class="ghost" onclick="markLearned('${escA(w[0])}')">${d?'✓ '+esc(tr('done')):'✓ '+esc(tr('learned'))}</button></div></div>`}).join('')}</div><button class="primary" style="width:100%;margin-top:15px" onclick="startQuiz('${l.id}')">🧠 ${esc(tr('quiz'))}</button>`}
function speak(text){if(!('speechSynthesis'in window)){toast(tr('noSpeech'));return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='nl-NL';u.rate=.78;u.volume=1;const vs=speechSynthesis.getVoices?.()||[];u.voice=vs.find(v=>v.lang==='nl-NL')||vs.find(v=>v.lang?.toLowerCase().startsWith('nl'))||null;speechSynthesis.speak(u)}
function markLearned(w){const a=learned();if(!a.includes(w)){a.push(w);saveLearned(a);touchStreak();toast(tr('correct'))}renderLesson(window.lessonId)}
function showReview(){const a=learned();if(!a.length){screen.innerHTML=`<button class="back" onclick="show('learn')">${esc(tr('back'))}</button><div class="card" style="margin-top:20px"><h2>${esc(tr('review'))}</h2><p class="sub">${esc(tr('emptyReview'))}</p><button class="primary" style="margin-top:14px" onclick="show('learn')">${esc(tr('start'))}</button></div>`;return}const pool=[];lessons.forEach(l=>l.words.forEach(w=>{if(a.includes(w[0]))pool.push({l,w})}));const item=pool[0];screen.innerHTML=`<button class="back" onclick="show('learn')">${esc(tr('back'))}</button><h1 class="page-title">🔁 ${esc(tr('review'))}</h1><p class="sub">${esc(tr('reviewSub'))}</p><div class="quiz"><div class="pill">${esc(item.l.title[lang()])}</div><div class="quiz-word">${esc(item.w[0])}</div><p class="sub">${esc(tr('meaning'))}</p><div class="answers" id="reviewAnswers"></div></div>`;buildAnswers(item,document.getElementById('reviewAnswers'),()=>show('learn'))}
function startQuiz(id){const l=lessons.find(x=>x.id===id)||lessons[0];const item=l.words[0];screen.innerHTML=`<button class="back" onclick="showLesson('${l.id}')">${esc(tr('back'))}</button><h1 class="page-title">🧠 ${esc(tr('quiz'))}</h1><p class="sub">${esc(tr('quizSub'))}</p><div class="quiz"><div class="pill">${esc(l.title[lang()])}</div><div class="quiz-word">${esc(item[0])}</div><p class="sub">${esc(tr('meaning'))}</p><div class="answers" id="quizAnswers"></div></div>`;buildAnswers({l,w:item},document.getElementById('quizAnswers'),()=>{markLearned(item[0]);showLesson(l.id)})}
function buildAnswers(item,box,onDone){const correct=item.w[2][lang()]||item.w[2].tr;const options=[correct];lessons.flatMap(l=>l.words).forEach(w=>{const m=w[2][lang()]||w[2].tr;if(options.length<3&&!options.includes(m))options.push(m)});options.sort(()=>Math.random()-.5);box.innerHTML=options.map(o=>`<button class="answer-btn" onclick="answerQuiz(this,${JSON.stringify(o===correct)},${JSON.stringify(escA(correct))})">${esc(o)}</button>`).join('');window.__quizDone=onDone}
function answerQuiz(btn,isCorrect,correct){if(document.querySelector('.answer-btn.correct'))return;if(isCorrect){btn.classList.add('correct');toast(tr('correct'));setTimeout(()=>window.__quizDone?.(),450)}else{btn.classList.add('wrong');toast(tr('tryAgain'))}}

function renderKids(){const stars=kidsStars();screen.innerHTML=`<button class="back" onclick="show('home')">${esc(tr('back'))}</button><section class="kids-hero"><div class="kids-rainbow">🌈</div><span class="eyebrow">${esc(kt('title'))}</span><h1>${esc(kt('hero'))}</h1><p>${esc(kt('intro'))}</p><div class="kids-safe">🛡️ ${esc(kt('safe'))}</div><div class="kids-score">⭐ ${esc(kt('stars'))}: <strong>${stars}</strong></div></section><div class="kids-grid">${kidsLessons.map(l=>`<button class="kids-card" onclick="showKidLesson('${l.id}')"><div class="kids-scene kid-art">${kidArt(l.id)}</div><div class="kids-card-title">${l.icon} ${esc(l.title[lang()])}</div><small>${esc(kt('open'))} →</small></button>`).join('')}</div>`}
function showKidLesson(id){window.kidLessonId=id;show('kidlesson')}
function renderKidLesson(id){const l=kidsLessons.find(x=>x.id===id)||kidsLessons[0];screen.innerHTML=`<button class="back" onclick="show('kids')">${esc(kt('back'))}</button><section class="kid-scene-card"><div class="big-scene kid-art">${kidArt(l.id)}</div><div class="speech-bubbles"><div class="speech speech-a">${esc(l.bubble[0])}</div><div class="speech speech-b">${esc(l.bubble[1])}</div></div><h1 class="page-title">${l.icon} ${esc(l.title[lang()])}</h1></section><div class="kid-words">${l.words.map(w=>`<article class="kid-word"><div><strong>${esc(w[0])}</strong><em>${esc(pronunciation(w))}</em><span>${esc(w[2][lang()])}</span></div><button class="kid-sound" onclick="speakKids(${JSON.stringify(w[0])})">🔊</button><button class="kid-repeat" onclick="speakKids(${JSON.stringify(w[0])})">${esc(kt('repeat'))}</button></article>`).join('')}</div><section class="kid-quiz"><span class="eyebrow">⭐ ${esc(kt('question'))}</span><h2>${esc(l.quiz.q[lang()])}</h2><div class="kid-options">${l.quiz.options.map((o,i)=>`<button onclick="kidAnswer(this,${i},${l.quiz.answer})">${esc(o)}</button>`).join('')}</div><div id="kidResult" class="kid-result"></div></section><button class="primary kids-next" onclick="nextKid('${l.id}')">${esc(kt('next'))} →</button>`}
function kidAnswer(btn,i,a){const box=document.getElementById('kidResult');document.querySelectorAll('.kid-options button').forEach(b=>b.disabled=true);if(i===a){btn.classList.add('correct');addKidsStar();box.textContent='⭐ +1';toast('⭐ +1')}else{btn.classList.add('wrong');box.textContent=tr('tryAgain')}}

function renderTranslate(){screen.innerHTML=`<button class="back" onclick="show('home')">${esc(tr('back'))}</button><h1 class="page-title">💬 ${esc(tr('translateTitle'))}</h1><p class="sub">${esc(tr('translateDesc'))}</p><div class="translate-box" style="margin-top:18px"><input id="phraseInput" class="translate-input" list="phraseList" placeholder="${esc(tr('placeholder'))}" autocomplete="off"><datalist id="phraseList">${phrasePairs.map(p=>`<option value="${esc(p[0])}">`).join('')}</datalist><div class="translate-actions"><button class="ghost" onclick="clearTranslate()">${esc(tr('clear'))}</button><button class="primary" onclick="findPhrase()">${esc(tr('translate'))}</button></div></div><div id="phraseResult"></div><div class="phrase-list">${phrasePairs.slice(0,8).map(p=>`<button class="phrase-chip" onclick="usePhrase('${escA(p[0])}')">${esc(p[0])}</button>`).join('')}</div>`}
function findPhrase(){const input=document.getElementById('phraseInput'),result=document.getElementById('phraseResult'),key=normalize(input?.value||'');if(!key){toast(tr('noTrans'));return}const p=phrasePairs.find(x=>x.some(v=>normalize(v)===key));if(!p){result.innerHTML=`<div class="result"><div class="answer">${esc(tr('noTrans'))}</div></div>`;return}const idx=lang()==='tr'?1:lang()==='en'?2:3;const answer=normalize(p[0])===key?p[idx]:p[0];result.innerHTML=`<div class="result"><div class="mini">${esc(tr('translateTitle'))}</div><div class="answer">${esc(answer)}</div><div class="result-note">${esc(tr('phraseHint'))}</div><button class="ghost" onclick="speak('${escA(p[0])}')">🔊 ${esc(tr('listen'))}</button></div>`}
function usePhrase(p){const i=document.getElementById('phraseInput');if(i){i.value=p;findPhrase()}}function clearTranslate(){const i=document.getElementById('phraseInput'),r=document.getElementById('phraseResult');if(i)i.value='';if(r)r.innerHTML=''}
function mapsUrl(q,coords){let u=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;if(coords)u+=`&center=${coords.latitude},${coords.longitude}`;return u}function openNearby(label,q){const fallback=mapsUrl(q);if(!navigator.geolocation){location.href=fallback;return}navigator.geolocation.getCurrentPosition(p=>location.href=mapsUrl(q,p.coords),()=>location.href=fallback,{timeout:5000,maximumAge:300000,enableHighAccuracy:false})}function requestLocation(){if(!navigator.geolocation){toast('Location unavailable');return}navigator.geolocation.getCurrentPosition(()=>toast('✓'),()=>toast('Konum izni verilmedi; genel arama yine çalışır.'),{timeout:7000,maximumAge:300000,enableHighAccuracy:false})}

  const photoCss = `

  // FINAL VOICE LAYER: use a Dutch nl-NL voice when available, wait for iOS/Safari
  // voices to load, and keep adult/kids delivery deliberately clear and gentle.
  function speakFinal(text, profile){
    if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined'){
      if(typeof toast==='function') toast((typeof tr==='function'?tr('noSpeech'):'Speech playback is not available.'));
      return;
    }
    const synth=window.speechSynthesis;
    synth.cancel();
    let started=false;
    const start=()=>{
      if(started) return;
      started=true;
      try{ synth.removeEventListener('voiceschanged',start); }catch(e){}
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang='nl-NL';
      u.rate=profile.rate;
      u.pitch=profile.pitch;
      u.volume=profile.volume;
      const voices=synth.getVoices ? synth.getVoices() : [];
      u.voice=voices.find(v=>(v.lang||'').toLowerCase()==='nl-nl') ||
               voices.find(v=>(v.lang||'').toLowerCase().startsWith('nl')) || null;
      try{ synth.resume(); synth.speak(u); }
      catch(e){ if(typeof toast==='function') toast((typeof tr==='function'?tr('noSpeech'):'Speech playback is not available.')); }
    };
    const voices=synth.getVoices ? synth.getVoices() : [];
    if(voices.length) start();
    else {
      try{ synth.addEventListener('voiceschanged',start,{once:true}); }catch(e){}
      setTimeout(start,800);
    }
  }
  window.speak=function(text){ speakFinal(text,{rate:0.74,pitch:1.0,volume:1}); };
  window.speakKids=function(text){ speakFinal(text,{rate:0.66,pitch:1.08,volume:0.95}); };

  try{

      localStorage.removeItem('yanimda_lang');
      if(typeof setup==='function') setTimeout(()=>setup(),0);
    }
  }catch(e){}
