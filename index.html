<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YANIMDA">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>YANIMDA</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" onclick="show('home')" aria-label="YANIMDA Ana Sayfa">
      <span class="logo-mark"><span>♥</span></span>
      <span class="brand-copy"><strong>YANIMDA</strong><small>Her zaman yanında.</small></span>
    </button>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menü"><span></span><span></span><span></span></button>
  </header>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>YANIMDA</strong><button onclick="toggleMenu()">×</button></div>
    <button onclick="show('home');toggleMenu()">⌂ <span>Ana Sayfa</span></button>
    <button onclick="show('jobs');toggleMenu()">💼 <span>İş Bul</span></button>
    <button onclick="show('learn');toggleMenu()">📖 <span>Hollandaca Öğren</span></button>
    <button onclick="show('translate');toggleMenu()">文 <span>Çeviri</span></button>
    <button onclick="show('nearby');toggleMenu()">⌖ <span>Yakınımda</span></button>
    <button onclick="show('profile');toggleMenu()">◯ <span>Profil & Ayarlar</span></button>
    <div class="drawer-note">Yeni bir ülkede yalnız değilsin.</div>
  </div>
  <div id="shade" class="shade" onclick="toggleMenu()"></div>

  <main id="screen"></main>

  <nav class="bottom-nav" aria-label="Ana menü">
    <button onclick="show('home')" data-s="home"><span class="nav-icon">⌂</span><span>Ana Sayfa</span></button>
    <button onclick="show('jobs')" data-s="jobs"><span class="nav-icon">💼</span><span>İş Bul</span></button>
    <button onclick="show('learn')" data-s="learn"><span class="nav-icon">📖</span><span>Öğren</span></button>
    <button onclick="show('translate')" data-s="translate"><span class="nav-icon">文</span><span>Çeviri</span></button>
    <button onclick="show('nearby')" data-s="nearby"><span class="nav-icon">⌖</span><span>Yakınımda</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
